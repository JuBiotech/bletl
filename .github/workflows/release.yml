name: release-pipeline

on:
  release:
    types:
      - created


jobs:
  release-job:
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        uv sync --group dev
    - name: Test with pytest
      run: |
        uv run pytest --cov=./bletl --cov-report xml --cov-report term-missing tests/
    - name: Build package
      run: |
        uv run python -m build
    - name: Check version number match
      run: |
        echo "GITHUB_REF: ${GITHUB_REF}"
        # Make sure the package version is the same as the tag
        grep -Rq "^Version: ${GITHUB_REF:11}$" bletl.egg-info/PKG-INFO
    - name: Publish to PyPI
      run: |
        uv run twine check dist/*
        uv run twine upload --repository pypi --username __token__ --password ${PYPI_TOKEN} dist/*
    - name: Test installation
      run: |
        sleep 120
        uv pip install bletl==${GITHUB_REF:11}
