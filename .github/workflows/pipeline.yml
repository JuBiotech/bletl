name: pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14", "3.15"]
        pymc-version: ["without", "'pymc>=5.0.0'"]
    steps:
    - uses: actions/checkout@v7
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv sync --group dev
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 bletl/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        uv run flake8 bletl/ --count --exit-zero --statistics
    - name: Test without PyMC
      if: matrix.pymc-version == 'without'
      run: |
        uv run pytest -v --cov=./bletl --cov-report xml --cov-report term-missing tests/
    - name: Install and test with PyMC
      if: matrix.pymc-version != 'without'
      run: |
        uv sync --group pymc
        uv run pytest -v --cov=./bletl --cov-report xml --cov-report term-missing tests/
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
    - name: Test Wheel build, install and import
      run: |
        uv run python -m build
        uv run twine check dist/*
        cd dist
        uv pip install bletl*.whl
        uv run python -c "import bletl; print(bletl.__version__)"
